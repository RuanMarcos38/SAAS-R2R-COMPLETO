name: Agendador do Diretor IA
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  run-director:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verificar configuração do serviço
        env:
          DIRECTOR_APP_URL: ${{ secrets.DIRECTOR_APP_URL }}
          DIRECTOR_AUTOMATION_SECRET: ${{ secrets.DIRECTOR_AUTOMATION_SECRET }}
        run: |
          if [ -z "$DIRECTOR_APP_URL" ] || [ -z "$DIRECTOR_AUTOMATION_SECRET" ]; then
            echo "Configurar DIRECTOR_APP_URL e DIRECTOR_AUTOMATION_SECRET nos segredos do repositório."
            exit 1
          fi
      - name: Processar fila do Diretor
        env:
          DIRECTOR_APP_URL: ${{ secrets.DIRECTOR_APP_URL }}
          DIRECTOR_AUTOMATION_SECRET: ${{ secrets.DIRECTOR_AUTOMATION_SECRET }}
        run: |
          curl --fail-with-body --show-error --silent \
            --connect-timeout 10 --max-time 120 \
            --retry 2 --retry-delay 5 \
            -X POST "${DIRECTOR_APP_URL%/}/api/director/work" \
            -H "x-automation-secret: ${DIRECTOR_AUTOMATION_SECRET}" \
            -H 'Content-Type: application/json'
